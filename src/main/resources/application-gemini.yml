# Google Gemini. Requires GEMINI_API_KEY.
# Chat goes through Gemini's OpenAI-compatible endpoint. Embeddings use the native Google GenAI client, because
# the compatible embeddings endpoint omits the "index" field the OpenAI client requires.
spring.ai.model.embedding: none            # turn the OpenAI embedding client off
spring.ai.model.embedding.text: google-genai   # turn the native Gemini embedding client on

spring:
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      chat:
        options:
          model: ${LLM_MODEL:gemini-3.8-flash}
          temperature: 0.2
    google:
      genai:
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: 768
            task-type: RETRIEVAL_DOCUMENT
    vectorstore:
      pgvector:
        table-name: code_chunks_gemini
        dimensions: 768