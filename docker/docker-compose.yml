services:
  pgvector:
    image: pgvector/pgvector:pg17
    labels:
      # Lets Spring Boot treat this image as a regular PostgreSQL service connection.
      org.springframework.boot.service-connection: postgres
    container_name: sentinel-pgvector
    environment:
      POSTGRES_DB: codesentinel
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 images keep data in a versioned subfolder, so mount the parent folder.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: